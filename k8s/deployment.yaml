apiVersion: apps/v1
kind: Deployment
metadata:
  name: astro-blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: astro-blog
  template:
    metadata:
      labels:
        app: astro-blog
    spec:
      containers:
      - name: blog
        # เปลี่ยน tsangprakarn เป็น username GitHub ของคุณ
        # เช่น ghcr.io/tsangprakarn/astro-blog:latest
        image: ghcr.io/tsangprakarn/astro-blog:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: astro-blog-svc
spec:
  selector:
    app: astro-blog
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080 # เปลี่ยนเป็น port ที่ว่าง
  type: NodePort
